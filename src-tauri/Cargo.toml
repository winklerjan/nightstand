[package]
name = "nightstand"
version = "0.1.0"
description = "Nightstand desktop app"
authors = ["Jan Winkler"]
edition = "2021"

[lib]
name = "nightstand_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
