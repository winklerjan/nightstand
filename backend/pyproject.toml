[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nightstand"
version = "0.1.0"
description = "Nightstand Python sidecar — FastAPI backend for Calibre integration"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
]

[tool.hatch.build.targets.wheel]
packages = ["nightstand"]
